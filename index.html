<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Доска публикаций</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Доска публикаций</h1>

    <div class="columns">
      <section class="column">
        <h2>Публикации</h2>
        <button type="button" id="load-btn">Загрузить публикации</button>

        <ul id="posts"></ul>
        <p id="empty" class="empty">Публикации не загружены</p>
      </section>

      <section class="column">
        <h2>Новая публикация</h2>
        <form id="post-form" novalidate>
          <label for="title">Заголовок</label>
          <input type="text" id="title" name="title" placeholder="Например, Мой первый пост">
          <span class="error" id="titleError"></span>

          <label for="body">Текст</label>
          <textarea id="body" name="body" rows="4" placeholder="Текст публикации"></textarea>
          <span class="error" id="bodyError"></span>

          <button type="submit" id="submit-btn">Создать публикацию</button>
        </form>

        <p id="message" class="message"></p>
      </section>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
